# Acceptance site. Each release contains the production dist files only.
server {
    listen 9010;
    listen [::]:9010;
    server_name _;
    root /var/www/xuji-showcase/current;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/xuji-showcase.access.log;
    error_log /var/log/nginx/xuji-showcase.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types text/css application/javascript application/json application/octet-stream image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Keep an already-open page working across a release switch.
    location @previous_assets {
        root /var/www/xuji-showcase/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    # Byte ranges refer to retained raw float32 offsets, including multipart requests.
    location ^~ /data/journey/windows-v1/ {
        try_files $uri =404;
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /data/wind/windows-v1/ {
        try_files $uri =404;
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/data/.*\.bin$ {
        try_files $uri @previous_data;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        try_files $uri @previous_data;
        add_header Cache-Control "no-cache";
    }
    location @previous_data {
        root /var/www/xuji-showcase/previous;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
