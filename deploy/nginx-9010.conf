# Acceptance site. Each release contains the production dist files only.
server {
    listen 9010;
    listen [::]:9010;
    server_name _;
    root /var/www/xuji-showcase/current;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/xuji-showcase.access.log;
    error_log /var/log/nginx/xuji-showcase.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/octet-stream image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
